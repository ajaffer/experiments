<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- fixed light surface so the chart is legible on any page theme -->
  <rect x="0.5" y="0.5" width="719" height="439" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>

  <text x="32" y="34" font-size="17" font-weight="600" fill="#0b0b0b">Load imbalance (cv) falls as 1/&#8730;V</text>
  <text x="32" y="53" font-size="12.5" fill="#52514e">3-node cluster · measured over 30 rings vs. closed-form &#8730;((N-1)/(N&#183;V+1))</text>

  <!-- y gridlines + labels (cv: 0 .. 0.75) -->
  <g font-size="11" fill="#898781" font-variant-numeric="tabular-nums">
    <line x1="64" y1="64"    x2="592" y2="64"    stroke="#e1e0d9"/><text x="56" y="67.5" text-anchor="end">0.75</text>
    <line x1="64" y1="126.4" x2="592" y2="126.4" stroke="#e1e0d9"/><text x="56" y="129.9" text-anchor="end">0.60</text>
    <line x1="64" y1="188.8" x2="592" y2="188.8" stroke="#e1e0d9"/><text x="56" y="192.3" text-anchor="end">0.45</text>
    <line x1="64" y1="251.2" x2="592" y2="251.2" stroke="#e1e0d9"/><text x="56" y="254.7" text-anchor="end">0.30</text>
    <line x1="64" y1="313.6" x2="592" y2="313.6" stroke="#e1e0d9"/><text x="56" y="317.1" text-anchor="end">0.15</text>
    <line x1="64" y1="376"   x2="592" y2="376"   stroke="#c3c2b7"/><text x="56" y="379.5" text-anchor="end">0.00</text>
  </g>

  <!-- x ticks (vnodes, log scale) -->
  <g font-size="11" fill="#898781" font-variant-numeric="tabular-nums" text-anchor="middle">
    <text x="64"  y="393">1</text>
    <text x="262" y="393">8</text>
    <text x="328" y="393">16</text>
    <text x="394" y="393">32</text>
    <text x="460" y="393">64</text>
    <text x="526" y="393">128</text>
    <text x="592" y="393">256</text>
  </g>
  <text x="328" y="416" font-size="12" fill="#52514e" text-anchor="middle">vnodes per node (log scale)</text>
  <text x="20" y="220" font-size="12" fill="#52514e" text-anchor="middle" transform="rotate(-90 20 220)">cv  (stddev &#247; mean load)</text>

  <!-- theory: dashed aqua -->
  <polyline fill="none" stroke="#1baf7a" stroke-width="2" stroke-dasharray="6 4"
    points="64,80.6 262,259.5 328,292.8 394,317.8 460,334.4 526,346.9 592,355.2"/>
  <!-- measured: solid blue -->
  <polyline fill="none" stroke="#2a78d6" stroke-width="2"
    points="64,126.4 262,276.2 328,305.3 394,321.9 460,334.4 526,346.9 592,355.2"/>

  <!-- markers (2px surface ring so overlapping right-side points stay distinct) -->
  <g fill="#1baf7a" stroke="#fcfcfb" stroke-width="1.5">
    <circle cx="64" cy="80.6" r="4"/><circle cx="262" cy="259.5" r="4"/><circle cx="328" cy="292.8" r="4"/><circle cx="394" cy="317.8" r="4"/><circle cx="460" cy="334.4" r="4"/><circle cx="526" cy="346.9" r="4"/><circle cx="592" cy="355.2" r="4"/>
  </g>
  <g fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5">
    <circle cx="64" cy="126.4" r="4"/><circle cx="262" cy="276.2" r="4"/><circle cx="328" cy="305.3" r="4"/><circle cx="394" cy="321.9" r="4"/><circle cx="460" cy="334.4" r="4"/><circle cx="526" cy="346.9" r="4"/><circle cx="592" cy="355.2" r="4"/>
  </g>

  <!-- direct value labels at the separated left end + converged right end -->
  <g font-size="11.5" font-variant-numeric="tabular-nums">
    <text x="74" y="76"  fill="#52514e">0.71 theory</text>
    <text x="74" y="132" fill="#52514e">0.60 measured</text>
    <text x="600" y="358" fill="#52514e">0.05</text>
  </g>

  <!-- legend (mark + ink label; solid vs dashed is the secondary channel) -->
  <g transform="translate(430,96)" font-size="12">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#2a78d6" stroke-width="2"/>
    <circle cx="13" cy="0" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/>
    <text x="34" y="4" fill="#0b0b0b">measured cv</text>
    <line x1="0" y1="22" x2="26" y2="22" stroke="#1baf7a" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="13" cy="22" r="4" fill="#1baf7a" stroke="#fcfcfb" stroke-width="1.5"/>
    <text x="34" y="26" fill="#0b0b0b">theory  1/&#8730;V</text>
  </g>

  <!-- takeaway annotation -->
  <text x="430" y="156" font-size="12.5" font-weight="600" fill="#0b0b0b">&#215;4 vnodes &#8594; &#189; the imbalance</text>
  <text x="430" y="174" font-size="11.5" fill="#898781">diminishing returns; lines converge</text>
</svg>
